services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ecommerce_db
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Thiếu DB_PASSWORD, copy .env.example thành .env rồi điền}
    volumes:
      # Lưu dữ liệu ra ngoài container, tắt container đi dữ liệu vẫn còn
      - mysql-data:/var/lib/mysql
    healthcheck:
      # app chỉ khởi động khi MySQL đã sẵn sàng nhận kết nối
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Trong mạng của compose, app gọi MySQL bằng tên service "mysql", không phải localhost
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ecommerce_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:?Thiếu JWT_SECRET, copy .env.example thành .env rồi điền}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-1800000}

volumes:
  mysql-data:
