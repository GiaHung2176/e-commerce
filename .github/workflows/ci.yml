name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # Lưu cache thư mục ~/.m2 để các lần chạy sau không tải lại dependency
          cache: maven

      # mvnw được commit với quyền 644 (từ Windows), trên Linux phải cấp quyền chạy
      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B test
        env:
          # Giá trị giả chỉ dùng cho test, không phải secret thật
          JWT_SECRET: ci-test-only-secret-not-used-anywhere-else-0123456789
